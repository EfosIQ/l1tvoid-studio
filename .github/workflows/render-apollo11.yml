name: Render Apollo 11 TikTok

on:
  push:
    branches:
      - video/apollo-11-tiktok
  workflow_dispatch:

concurrency:
  group: apollo11-render-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            timeout 120s sudo apt-get -o Acquire::Retries=2 update && \
              timeout 180s sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng && break
            if [ "$attempt" -eq 3 ]; then echo "Package installation failed after retries"; exit 1; fi
            sleep $((attempt * 20))
          done
          python -m pip install --disable-pip-version-check edge-tts pillow
      - name: Prepare original score and subtitles
        run: python scripts/prepare_audio.py
      - name: Download authentic NASA archive photographs
        run: python scripts/fetch_archive.py
      - name: Render cinematic documentary frames
        run: python scripts/archival_edit.py
      - name: Create Russian narration
        run: |
          if ! edge-tts --voice ru-RU-DmitryNeural --rate=-4% --file scripts/narration.txt --write-media output/narration.mp3; then
            espeak-ng -v ru -s 145 -f scripts/narration.txt -w output/narration.wav
            ffmpeg -y -i output/narration.wav output/narration.mp3
          fi
      - name: Assemble vertical MP4
        run: |
          ffmpeg -y -framerate 24 -i output/frame_%04d.jpg -i output/narration.mp3 -i output/music.wav -vf "scale=1080:1920:flags=lanczos,subtitles=output/subtitles.srt:fontsdir=/usr/share/fonts/truetype/dejavu:force_style='FontName=DejaVu Sans,FontSize=8,PrimaryColour=&H00FFFFFF,OutlineColour=&H99000000,BackColour=&H66000000,BorderStyle=3,Outline=0,Shadow=0,MarginL=18,MarginR=18,MarginV=45,Alignment=2'" -filter_complex "[1:a]volume=1.0[voice];[2:a]volume=0.20[music];[voice][music]amix=inputs=2:duration=longest:normalize=0[a]" -map 0:v -map "[a]" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart output/apollo11_tiktok.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: apollo11-tiktok
          path: output/apollo11_tiktok.mp4
          retention-days: 14
